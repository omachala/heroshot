<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="stylesheet" href="/palette.css" />
    <title>Welcome - Heroshot</title>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3MGBYS1GNM"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());
      gtag('config', 'G-3MGBYS1GNM');
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap');

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          'Nunito Sans',
          system-ui,
          -apple-system,
          sans-serif;
        min-height: 100vh;
        background: linear-gradient(
          135deg,
          var(--bg-gradient-start) 0%,
          var(--bg-gradient-end) 100%
        );
        color: var(--text-primary);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }
      .container {
        max-width: 560px;
        width: 100%;
        text-align: center;
      }
      .logo {
        width: 72px;
        height: 72px;
        margin-bottom: 1rem;
      }
      h1 {
        font-size: 1.75rem;
        font-weight: 700;
        font-style: italic;
        background: linear-gradient(135deg, var(--brand-main) 0%, var(--brand-light) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 0.5rem;
      }
      .subtitle {
        font-size: 1rem;
        color: var(--text-secondary);
        margin-bottom: 1.5rem;
      }
      .url-bar {
        display: flex;
        background: var(--bg-card);
        border-radius: 8px;
        box-shadow: 0 4px 12px var(--shadow-color-strong);
        overflow: hidden;
        border: 1px solid var(--border-color);
        margin-bottom: 0.5rem;
      }
      .url-bar input {
        flex: 1;
        padding: 1rem 1.25rem;
        border: none;
        font-size: 1rem;
        font-family: ui-monospace, monospace;
        color: var(--text-primary);
        background: var(--input-bg);
        outline: none;
      }
      .url-bar input::placeholder {
        color: var(--text-muted);
      }
      .url-bar button {
        padding: 1rem 1.75rem;
        background: linear-gradient(135deg, var(--brand-main) 0%, var(--brand-dark) 100%);
        border: none;
        color: white;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        transition: opacity 0.15s;
      }
      .url-bar button:hover {
        opacity: 0.9;
      }
      .url-hint {
        font-size: 0.8rem;
        color: var(--text-muted);
        margin-bottom: 2.5rem;
      }
      .url-hint kbd {
        background: var(--kbd-bg);
        border: 1px solid var(--border-color);
        border-radius: 3px;
        padding: 1px 5px;
        font-family: ui-monospace, monospace;
        font-size: 0.75rem;
        color: var(--text-primary);
      }

      .shortcuts {
        background: var(--bg-card);
        border-radius: 10px;
        padding: 1.25rem 1.5rem;
        border: 1px solid var(--border-color);
        margin-bottom: 2rem;
        text-align: left;
      }
      .shortcuts-title {
        font-size: 0.7rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-muted);
        margin-bottom: 0.75rem;
      }
      .shortcut-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.5rem 1.5rem;
      }
      .shortcut {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .shortcut kbd {
        background: var(--kbd-bg);
        border: 1px solid var(--border-color);
        border-radius: 4px;
        padding: 2px 6px;
        font-family: ui-monospace, monospace;
        font-size: 0.75rem;
        color: var(--text-primary);
        min-width: 50px;
        text-align: center;
      }
      .shortcut span {
        font-size: 0.85rem;
        color: var(--text-secondary);
      }

      .links {
        display: flex;
        justify-content: center;
        gap: 1.5rem;
      }
      .links a {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        color: var(--text-muted);
        text-decoration: none;
        font-size: 0.85rem;
        transition: color 0.15s;
      }
      .links a:hover {
        color: var(--brand-main);
      }
      .links svg {
        width: 16px;
        height: 16px;
      }

      @media (max-width: 500px) {
        .shortcut-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img src="/logo.svg" alt="Heroshot" class="logo" />
      <h1>Welcome to Heroshot</h1>
      <p class="subtitle">Navigate to your app to start capturing screenshots</p>

      <div class="url-bar">
        <input type="url" id="url-input" placeholder="https://your-app.com" autofocus />
        <button type="button" onclick="navigateToUrl()">Go</button>
      </div>
      <p class="url-hint">Press <kbd>Enter</kbd> or use the browser address bar</p>

      <div class="shortcuts">
        <div class="shortcuts-title">Quick Reference</div>
        <div class="shortcut-grid">
          <div class="shortcut">
            <kbd>Click</kbd>
            <span>Pick element</span>
          </div>
          <div class="shortcut">
            <kbd>Drag</kbd>
            <span>Adjust padding</span>
          </div>
          <div class="shortcut">
            <kbd>Esc</kbd>
            <span>Cancel</span>
          </div>
          <div class="shortcut">
            <kbd>Shift</kbd>
            <span>Single-side resize</span>
          </div>
        </div>
      </div>

      <div class="links">
        <a href="https://heroshot.dev/docs/getting-started" target="_blank">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
          </svg>
          Docs
        </a>
        <a href="https://github.com/omachala/heroshot" target="_blank">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.44 9.8 8.2 11.38.6.11.82-.26.82-.58v-2.03c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.08-.74.08-.73.08-.73 1.2.08 1.84 1.23 1.84 1.23 1.07 1.84 2.8 1.3 3.49 1 .1-.78.42-1.3.76-1.6-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.13-.3-.54-1.52.12-3.18 0 0 1-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.28-1.55 3.29-1.23 3.29-1.23.66 1.66.24 2.88.12 3.18a4.65 4.65 0 0 1 1.23 3.22c0 4.61-2.8 5.63-5.48 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.21.7.82.58A12 12 0 0 0 12 0z"
            />
          </svg>
          GitHub
        </a>
        <a href="https://www.npmjs.com/package/heroshot" target="_blank">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M0 7.334v8h6.666v1.332H12v-1.332h12v-8H0zm6.666 6.664H5.334v-4H3.999v4H1.335V8.667h5.331v5.331zm4 0v1.336H8.001V8.667h5.334v5.332h-2.669v-.001zm12.001 0h-1.33v-4h-1.336v4h-1.335v-4h-1.33v4h-2.671V8.667h8.002v5.331zM10.665 10H12v2.667h-1.335V10z"
            />
          </svg>
          npm
        </a>
      </div>
    </div>

    <script>
      function navigateToUrl() {
        const input = document.getElementById('url-input');
        let url = input.value.trim();
        if (!url) return;
        if (!url.startsWith('http://') && !url.startsWith('https://')) {
          url = 'https://' + url;
        }
        window.location.href = url;
      }
      document.getElementById('url-input').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') navigateToUrl();
      });
    </script>
  </body>
</html>
