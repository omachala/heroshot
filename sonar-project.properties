# SonarCloud Configuration

# Project identification
sonar.projectKey=heroshot
sonar.projectName=Heroshot

# Source directories (exclude tests from analysis)
sonar.sources=src,editor/src,docs
sonar.exclusions=**/tests/**,**/*.test.ts,**/*.spec.ts,**/fixtures/**,**/node_modules/**,docs/public/__tests__/**

# Test directories
sonar.tests=src/tests,editor/src/lib/tests,editor/tests
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts

# Exclude from duplication analysis (CPD)
sonar.cpd.exclusions=**/tests/**,**/*.test.ts,**/*.spec.ts,**/fixtures/**,editor/tests/**,src/tests/**,src/utils/tests/**

# Exclude from coverage
sonar.coverage.exclusions=**/tests/**,**/*.test.ts,**/*.spec.ts

# TypeScript configuration
sonar.typescript.lcov.reportPaths=coverage/lcov.info
