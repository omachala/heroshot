name: Build Binaries

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-latest
            target: darwin-arm64
          - os: macos-latest
            target: darwin-x64
            cross_compile: true # Cross-compile x64 from ARM runner
          - os: windows-latest
            target: windows-x64

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      # Using --no-frozen-lockfile because optionalDependencies reference
      # platform-specific packages that don't exist until we publish them
      - run: pnpm install --no-frozen-lockfile

      - name: Build binary
        run: |
          if [ "${{ matrix.cross_compile }}" = "true" ]; then
            bun run scripts/build-binary.ts --target=${{ matrix.target }}
          else
            bun run scripts/build-binary.ts --single
          fi
        shell: bash

      # Run the freshly built binary the way an end user would: with the build
      # machine's node_modules gone, so any absolute path baked in at build time
      # (e.g. playwright-core's package.json) fails to resolve - exactly the
      # failure mode of a downloaded release binary. Skipped for cross-compiled
      # targets, which can't run on the build host.
      - name: Smoke test binary (simulate end-user machine)
        if: ${{ matrix.cross_compile != true }}
        shell: bash
        run: |
          set -uo pipefail
          BINDIR="dist/binaries/heroshot-${{ matrix.target }}/bin"
          BIN="$BINDIR/heroshot"
          if [ "${{ matrix.target }}" = "windows-x64" ]; then BIN="$BINDIR/heroshot.exe"; fi
          mv node_modules ../nm_hidden
          status=0
          echo "--- heroshot --version ---"
          "$BIN" --version || status=1
          echo "--- heroshot mcp (initialize handshake) ---"
          OUT=$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' | "$BIN" mcp || true)
          echo "$OUT"
          echo "$OUT" | grep -q '"serverInfo"' || { echo "ERROR: MCP server did not respond"; status=1; }
          mv ../nm_hidden node_modules
          if [ "$status" -ne 0 ]; then echo "Smoke test FAILED"; exit 1; fi
          echo "Smoke test passed."

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: heroshot-${{ matrix.target }}
          path: dist/binaries/heroshot-${{ matrix.target == 'windows-x64' && 'windows' || matrix.target }}*
          retention-days: 30

  # Combine all artifacts into a single release asset
  release-assets:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Display structure
        run: ls -R artifacts

      - name: Rename binaries with platform suffix
        run: |
          cd artifacts
          for dir in heroshot-*/heroshot-*/bin; do
            platform=$(echo "$dir" | cut -d'/' -f1 | sed 's/heroshot-//')
            for file in "$dir"/*; do
              if [ -f "$file" ]; then
                filename=$(basename "$file")
                if [[ "$filename" == "heroshot.exe" ]]; then
                  mv "$file" "$dir/heroshot-${platform}.exe"
                elif [[ "$filename" == "heroshot" ]]; then
                  mv "$file" "$dir/heroshot-${platform}"
                fi
              fi
            done
          done
          ls -R

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/heroshot-*/heroshot-*/bin/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
