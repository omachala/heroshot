name: Update Visual Baselines

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for updating baselines'
        required: false
        default: 'Update visual baselines'

jobs:
  update-baselines:
    runs-on: [self-hosted, din]
    steps:
      - uses: actions/checkout@v6
        with:
          clean: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --prefer-offline

      - name: Build CLI
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: Clean test directories
        run: |
          rm -rf src/tests/cli/heroshots
          git checkout -- src/tests/cli/baselines/ 2>/dev/null || true
          git clean -fd src/tests/cli/baselines/

      - name: Generate screenshots with heroshot
        run: node ${{ github.workspace }}/dist/cli/cli.js
        working-directory: src/tests/cli

      - name: Copy heroshots to baselines
        run: |
          mkdir -p src/tests/cli/baselines
          cp src/tests/cli/heroshots/*.png src/tests/cli/baselines/

      - name: Check for baseline changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain src/tests/cli/baselines/)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Baseline changes detected:"
            git status --porcelain src/tests/cli/baselines/
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No baseline changes"
          fi

      - name: Create PR with updated baselines
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'test: update visual regression baselines'
          title: 'test: update visual regression baselines'
          body: |
            ## Visual Baseline Updates

            This PR was automatically generated by the [Update Visual Baselines](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) workflow.

            **Reason:** ${{ github.event.inputs.reason }}

            Please review the baseline changes carefully before merging.
          branch: update-visual-baselines
          delete-branch: true
          add-paths: |
            src/tests/cli/baselines/*.png
