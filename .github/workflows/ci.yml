name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Fast checks - must pass before expensive tests run
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Lint editor
        run: pnpm lint:editor

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck editor
        run: pnpm typecheck:editor

      - name: Svelte warnings check
        run: pnpm check:svelte

      - name: Knip (unused code)
        run: pnpm knip

      - name: Unit tests with coverage
        run: pnpm vitest run --coverage

      - name: Editor unit tests with coverage
        run: pnpm test:editor:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info,./coverage/editor/lcov.info
          fail_ci_if_error: false

      - name: Changeset status
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        run: pnpm changeset status --since=origin/main

  # E2E tests - run after check passes
  e2e:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build editor
        run: pnpm build:editor

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: Run e2e tests
        run: pnpm test:editor:e2e

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: editor/test-results/
          retention-days: 7

  # CLI integration tests - run after check passes (parallel with e2e)
  cli:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: Run CLI integration tests
        run: pnpm test:cli
