name: Docker

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.8.0)'
        required: true

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            # Extract version from tag (heroshot@0.8.0 -> 0.8.0)
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#heroshot@}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download heroshot binary from release
        run: |
          gh release download "heroshot@${{ steps.version.outputs.version }}" \
            --pattern "heroshot-linux-x64" \
            --output heroshot
          chmod +x heroshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            heroshot/heroshot:${{ steps.version.outputs.version }}
            heroshot/heroshot:latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
